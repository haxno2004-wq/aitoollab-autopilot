<!doctype html>
<html>
<head><meta charset="utf-8" /><title>Session Stash icons</title>
<style>
  body { background: #0b0f14; color: #e8eef7; font: 14px system-ui; display: flex; gap: 40px; align-items: flex-end; padding: 40px; }
  figure { margin: 0; text-align: center; }
  figcaption { margin-top: 8px; color: #8b9bb4; font-size: 12px; }
  img { image-rendering: auto; }
  .small { image-rendering: pixelated; }
</style>
</head>
<body>
  <figure><img src="../icons/icon16.png" width="16" height="16" class="small" /><figcaption>16 (pixelated)</figcaption></figure>
  <figure><img src="../icons/icon32.png" width="32" height="32" /><figcaption>32</figcaption></figure>
  <figure><img src="../icons/icon48.png" width="48" height="48" /><figcaption>48</figcaption></figure>
  <figure><img src="../icons/icon128.png" width="128" height="128" /><figcaption>128</figcaption></figure>
</body>
</html>
