name: Fleet autopilot

on:
  schedule:
    - cron: "17 6 * * *"
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated platform ids (empty = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fleet-autopilot
  cancel-in-progress: false

jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [aitoollab, finflow, devtoolkit, labstore]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pipeline — ${{ matrix.platform }}
        id: pipe
        run: |
          set -e
          export PLATFORM=${{ matrix.platform }}
          if [ "$PLATFORM" = "labstore" ]; then
            # store: rotation-aware product creation; storefront ALWAYS deploys
            node scripts/store.mjs || echo "store: generation failed this run — will retry next run"
            node scripts/store-build.mjs
          else
            node scripts/discover.mjs
            node scripts/select.mjs
            node scripts/generate.mjs
            node scripts/build.mjs
          fi
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Pages project exists — ${{ matrix.platform }}
        if: steps.pipe.outcome == 'success'
        run: |
          set -e
          PROJECT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('platforms/${{ matrix.platform }}/config.json','utf8')).site.pagesProject || '${{ matrix.platform }}')")
          echo "project: $PROJECT"
          CODE=$(curl -s -o /tmp/p.json -w "%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}")
          echo "project create: HTTP $CODE"
          if [ "$CODE" = "200" ]; then echo "✅ created"
          elif grep -qi "already_exists\|already exists" /tmp/p.json; then echo "✅ already exists"
          else head -c 300 /tmp/p.json; echo; echo "::error::Could not ensure Pages project $PROJECT"; exit 1; fi
          echo "PAGES_PROJECT=$PROJECT" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Web Analytics tag — ${{ matrix.platform }}
        if: steps.pipe.outcome == 'success'
        continue-on-error: true
        run: |
          set -e
          # Resolve the live host for each platform. Cloudflare Web Analytics site tags are created in the
          # account where the host is served from; reading site.url can resolve to a foreign-owned bare domain
          # (moneypilot.pages.dev) or to a Pages project we don't own, so we pin the exact live host per platform.
          case "${{ matrix.platform }}" in
            aitoollab)  HOST=aitoollab.pages.dev  ;;
            labstore)   HOST=promptforge-shop.pages.dev ;;
            devtoolkit) HOST=devd3tollk.page.dev ;;
            finflow)    HOST=moneypilot-3gk.pages.dev ;;
            *)          HOST=;;
          esac
          if [ -z "$HOST" ]; then echo "⚠️ unknown platform ${{ matrix.platform }} — skipping Web Analytics"; exit 0; fi
          BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/rum/site_info"
          LIST=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$BASE?per_page=100")
          CODE=$(printf '%s' "$LIST" | tail -n1)
          BODY=$(printf '%s' "$LIST" | sed '$d')
          echo "rum list: HTTP $CODE"
          TAG=$(printf '%s' "$BODY" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const j=JSON.parse(d);const s=(j.result||[]).find(x=>x.host==='$HOST');console.log(s?s.site_tag:'')}catch{console.log('')}})")
          if [ -z "$TAG" ] && [ "$CODE" != "200" ]; then
            echo "::warning::rum list failed HTTP $CODE: $(printf '%s' "$BODY" | head -c 400)"
          fi
          if [ -z "$TAG" ]; then
            echo "Creating Web Analytics site for $HOST"
            POST=$(curl -s -w "\n%{http_code}" -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$BASE" -d "{\"name\":\"${{ env.PAGES_PROJECT }}\",\"host\":\"$HOST\"}")
            PCODE=$(printf '%s' "$POST" | tail -n1)
            PBODY=$(printf '%s' "$POST" | sed '$d')
            echo "rum create: HTTP $PCODE"
            if [ "$PCODE" != "200" ]; then echo "::warning::rum create failed HTTP $PCODE: $(printf '%s' "$PBODY" | head -c 400)"; fi
            TAG=$(printf '%s' "$PBODY" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).result.site_tag||'')}catch{console.log('')}})")
          fi
          if [ -n "$TAG" ]; then
            echo "CF_ANALYTICS_TOKEN=$TAG" >> "$GITHUB_ENV"
            echo "OK Web Analytics site info for $HOST: $TAG (env set)"
          else
            echo "⚠ Could not provision Web Analytics for $HOST — skipping beacon injection"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Inject Web Analytics beacon — ${{ matrix.platform }}
        if: steps.pipe.outcome == 'success'
        continue-on-error: true
        run: node scripts/inject-beacon.mjs
        env:
          DIST: dist/${{ matrix.platform }}

      - name: Deploy ${{ matrix.platform }} to Cloudflare Pages
        if: steps.pipe.outcome == 'success'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/${{ matrix.platform }} --project-name=${{ env.PAGES_PROJECT }} --commit-dirty=true

      - name: Ping IndexNow — ${{ matrix.platform }}
        if: steps.pipe.outcome == 'success'
        run: node scripts/indexnow.mjs
        continue-on-error: true
        env:
          PLATFORM: ${{ matrix.platform }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: Record report — ${{ matrix.platform }}
        if: always()
        run: node scripts/report.mjs
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Commit ${{ matrix.platform }} artifacts
        if: always()
        run: |
          git config user.name "fleet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/${{ matrix.platform }}/ 2>/dev/null || true
          git add content/${{ matrix.platform }}/ 2>/dev/null || true
          git add site/shared/img/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "fleet[${{ matrix.platform }}]: $(date -u +%F_%H:%M) run [skip ci]" || true
          # 4 matrix jobs push concurrently — rebase (state files are per-platform now,
          # so conflicts are impossible); fall back to merge if a rebase ever wedges
          for i in 1 2 3 4 5 6; do
            if git push origin HEAD:"${GITHUB_REF_NAME}" 2>/dev/null; then
              echo "✅ pushed on attempt $i"; break
            fi
            git pull --rebase origin "${GITHUB_REF_NAME}" 2>/dev/null \
              || (git rebase --abort 2>/dev/null; git pull --no-rebase origin "${GITHUB_REF_NAME}" 2>/dev/null) \
              || true
            echo "push race (attempt $i) — retrying in 10s"; sleep 10
          done

  dashboard:
    needs: platform
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync latest fleet state (let matrix pushes land)
        run: |
          sleep 45
          for i in 1 2 3; do git pull --rebase origin main 2>/dev/null && break || sleep 15; done
          git log --oneline -6

      - name: Safety-net commit (any artifacts lost to matrix push races)
        run: |
          git config user.name "fleet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/ content/ site/shared/img/ 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "fleet[sync]: lost-and-found artifacts [skip ci]" && for i in 1 2 3 4 5; do git pull --rebase origin main 2>/dev/null && git push origin HEAD:main 2>/dev/null && break || sleep 10; done) || true
          git pull --rebase origin main 2>/dev/null || true

      - name: Build Command Deck from live fleet state
        run: node scripts/dashboard.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Pages project exists — fleetdeck
        run: |
          set -e
          CODE=$(curl -s -o /tmp/p.json -w "%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"fleetdeck","production_branch":"main"}')
          echo "project create: HTTP $CODE"
          if [ "$CODE" = "200" ]; then echo "✅ created"
          elif grep -qi "already_exists\|already exists" /tmp/p.json; then echo "✅ already exists"
          else head -c 300 /tmp/p.json; echo; echo "::error::Could not ensure Pages project fleetdeck"; exit 1; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Web Analytics tag — fleetdeck
        continue-on-error: true
        run: |
          set -e
          HOST=fleetdeck.pages.dev
          BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/rum/site_info"
          LIST=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$BASE?per_page=100")
          CODE=$(printf '%s' "$LIST" | tail -n1)
          BODY=$(printf '%s' "$LIST" | sed '$d')
          echo "rum list: HTTP $CODE"
          TAG=$(printf '%s' "$BODY" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const j=JSON.parse(d);const s=(j.result||[]).find(x=>x.host==='$HOST');console.log(s?s.site_tag:'')}catch{console.log('')}})")
          if [ -z "$TAG" ] && [ "$CODE" != "200" ]; then
            echo "::warning::rum list failed HTTP $CODE: $(printf '%s' "$BODY" | head -c 400)"
          fi
          if [ -z "$TAG" ]; then
            echo "Creating Web Analytics site for fleetdeck.pages.dev"
            POST=$(curl -s -w "\n%{http_code}" -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$BASE" -d "{\"name\":\"fleetdeck\",\"host\":\"$HOST\"}")
            PCODE=$(printf '%s' "$POST" | tail -n1)
            PBODY=$(printf '%s' "$POST" | sed '$d')
            echo "rum create: HTTP $PCODE"
            if [ "$PCODE" != "200" ]; then echo "::warning::rum create failed HTTP $PCODE: $(printf '%s' "$PBODY" | head -c 400)"; fi
            TAG=$(printf '%s' "$PBODY" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).result.site_tag||'')}catch{console.log('')}})")
          fi
          if [ -n "$TAG" ]; then
            echo "CF_ANALYTICS_TOKEN=$TAG" >> "$GITHUB_ENV"
            echo "✅ Web Analytics site info for fleetdeck.pages.dev: $TAG"
          else
            echo "⚠️ Could not provision Web Analytics for fleetdeck — skipping beacon injection"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Inject Web Analytics beacon — fleetdeck
        continue-on-error: true
        run: node scripts/inject-beacon.mjs
        env:
          DIST: dist/dashboard

      - name: Deploy Command Deck
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/dashboard --project-name=fleetdeck --commit-dirty=true

      - name: Fleet summary
        if: always()
        run: node scripts/monitor/status.mjs --summary

      - name: Fleet summary
        if: always()
        run: node scripts/monitor/status.mjs --summary
