name: Fleet autopilot

on:
  schedule:
    - cron: "17 6 * * *"
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated platform ids (empty = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fleet-autopilot
  cancel-in-progress: false

jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [aitoollab, finflow, devtoolkit, labstore]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pipeline — ${{ matrix.platform }}
        id: pipe
        run: |
          set -e
          export PLATFORM=${{ matrix.platform }}
          if [ "$PLATFORM" = "labstore" ]; then
            # store: rotation-aware product creation; storefront ALWAYS deploys
            node scripts/store.mjs || echo "store: generation failed this run — will retry next run"
            node scripts/store-build.mjs
          else
            node scripts/discover.mjs
            node scripts/select.mjs
            node scripts/generate.mjs
            node scripts/build.mjs
          fi
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Pages project exists — ${{ matrix.platform }}
        if: steps.pipe.outcome == 'success'
        run: |
          set -e
          CODE=$(curl -s -o /tmp/p.json -w "%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"${{ matrix.platform }}","production_branch":"main"}')
          echo "project create: HTTP $CODE"
          if [ "$CODE" = "200" ]; then echo "✅ created"
          elif grep -qi "already_exists\|already exists" /tmp/p.json; then echo "✅ already exists"
          else head -c 300 /tmp/p.json; echo; echo "::error::Could not ensure Pages project ${{ matrix.platform }}"; exit 1; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy ${{ matrix.platform }} to Cloudflare Pages
        if: steps.pipe.outcome == 'success'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/${{ matrix.platform }} --project-name=${{ matrix.platform }} --commit-dirty=true

      - name: Ping IndexNow — ${{ matrix.platform }}
        if: steps.pipe.outcome == 'success'
        run: node scripts/indexnow.mjs
        continue-on-error: true
        env:
          PLATFORM: ${{ matrix.platform }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: Record report — ${{ matrix.platform }}
        if: always()
        run: node scripts/report.mjs
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Commit ${{ matrix.platform }} artifacts
        if: always()
        run: |
          git config user.name "fleet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/${{ matrix.platform }}/ 2>/dev/null || true
          git add content/${{ matrix.platform }}/ 2>/dev/null || true
          git add site/shared/img/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "fleet[${{ matrix.platform }}]: $(date -u +%F_%H:%M) run [skip ci]" || true
          # 4 matrix jobs push concurrently — retry until the race resolves
          for i in 1 2 3 4 5 6; do
            if git pull --rebase=autostash origin "${GITHUB_REF_NAME}" 2>/dev/null && git push origin HEAD:"${GITHUB_REF_NAME}" 2>/dev/null; then
              echo "✅ pushed on attempt $i"; break
            fi
            echo "push race (attempt $i) — retrying in 10s"; sleep 10
          done

  dashboard:
    needs: platform
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync latest fleet state (let matrix pushes land)
        run: |
          sleep 45
          for i in 1 2 3; do git pull --rebase origin main 2>/dev/null && break || sleep 15; done
          git log --oneline -6

      - name: Build Command Deck from live fleet state
        run: node scripts/dashboard.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Command Deck
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/dashboard --project-name=fleetdeck --commit-dirty=true

      - name: Fleet summary
        if: always()
        run: node scripts/monitor/status.mjs --summary
