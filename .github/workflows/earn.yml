name: Earning autopilot

on:
  schedule:
    # 06:17 UTC and 18:17 UTC daily (offset from the hour to dodge cron traffic jams)
    - cron: "17 6 * * *"
    - cron: "17 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: earning-autopilot
  cancel-in-progress: false

jobs:
  earn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Discover trending topics
        run: node scripts/discover.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Select topic
        run: node scripts/select.mjs

      - name: Generate article (Gemini → OpenRouter fallback)
        id: gen
        run: node scripts/generate.mjs
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Build site
        if: steps.gen.outcome == 'success'
        run: node scripts/build.mjs

      - name: Preflight Cloudflare credentials
        if: steps.gen.outcome == 'success'
        run: |
          set -e
          CODE=$(curl -s -o /tmp/cf.json -w "%{http_code}" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID")
          echo "token/account check: HTTP $CODE"
          if [ "$CODE" != "200" ]; then cat /tmp/cf.json; echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is invalid (see JSON above)"; exit 1; fi
          CODE2=$(curl -s -o /tmp/cfp.json -w "%{http_code}" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects")
          echo "Pages permission check: HTTP $CODE2"
          if [ "$CODE2" != "200" ]; then cat /tmp/cfp.json; echo "::error::Token missing Cloudflare Pages:Edit permission - re-create the API token using the 'Edit Cloudflare Workers' template PLUS 'Account > Cloudflare Pages > Edit'"; exit 1; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ensure Pages project exists (idempotent, strict)
        if: steps.gen.outcome == 'success'
        run: |
          OUT=$(npx wrangler pages project create aitoollab --production-branch=main 2>&1) || true
          echo "$OUT"
          if echo "$OUT" | grep -qiE "already exists"; then
            echo "✅ Pages project already exists"
          elif echo "$OUT" | grep -qiE "created successfully|\"created\": ?true|aitoollab"; then
            echo "✅ Pages project created"
          else
            echo "::error::Could not create Pages project 'aitoollab' — see wrangler output above (common causes: subdomain aitoollab.pages.dev already taken by another account, or token missing Pages:Edit)"
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.gen.outcome == 'success'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=aitoollab --commit-dirty=true

      - name: Ping IndexNow (Bing + others)
        if: steps.gen.outcome == 'success'
        run: node scripts/indexnow.mjs
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: Record report
        if: always()
        run: node scripts/report.mjs

      - name: Earning monitor summary
        if: always()
        run: node scripts/monitor/status.mjs --summary

      - name: Commit state + article record
        if: always()
        run: |
          git config user.name "earning-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/ 2>/dev/null || true
          git add content/ 2>/dev/null || true
          git add scripts/.discover.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "autopilot: $(date -u +%F) run [skip ci]"
          git pull --rebase=autostash origin ${GITHUB_REF_NAME} || true
          git push || echo "push failed (will retry next run)"
