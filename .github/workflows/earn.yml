name: Fleet autopilot

on:
  schedule:
    - cron: "17 6 * * *"
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated platform ids (empty = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fleet-autopilot
  cancel-in-progress: false

jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [aitoollab, finflow, devtoolkit, labstore]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pipeline — ${{ matrix.platform }}
        id: pipe
        run: |
          set -e
          export PLATFORM=${{ matrix.platform }}
          if [ "$PLATFORM" = "labstore" ]; then
            # store: rotation-aware product creation, then storefront build
            node scripts/store.mjs
            if [ -f state/labstore/.built.json ]; then
              node -e "
                const fs=require('fs');
                const p=JSON.parse(fs.readFileSync('state/labstore/.built.json','utf8'));
                fs.writeFileSync('state/labstore/.generate.json', JSON.stringify(p,null,2));
              "
              node scripts/build.mjs
            else
              echo "rotation skip — rebuilding storefront from archive"
              node -e "
                const fs=require('fs');
                const dir='content/labstore/products';
                const f=fs.existsSync(dir)?fs.readdirSync(dir).filter(x=>x.endsWith('.json'))[0]:null;
                if(!f){console.log('no products yet; nothing to build');process.exit(0);}
                fs.writeFileSync('state/labstore/.generate.json', fs.readFileSync(dir+'/'+f,'utf8'));
              "
              [ -f state/labstore/.generate.json ] && node scripts/build.mjs || echo "storefront not ready"
            fi
          else
            node scripts/discover.mjs
            node scripts/select.mjs
            node scripts/generate.mjs
            node scripts/build.mjs
          fi
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy ${{ matrix.platform }} to Cloudflare Pages
        if: steps.pipe.outcome == 'success'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/${{ matrix.platform }} --project-name=${{ matrix.platform }} --commit-dirty=true

      - name: Ping IndexNow — ${{ matrix.platform }}
        if: steps.pipe.outcome == 'success'
        run: node scripts/indexnow.mjs
        continue-on-error: true
        env:
          PLATFORM: ${{ matrix.platform }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: Record report — ${{ matrix.platform }}
        if: always()
        run: node scripts/report.mjs
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Commit ${{ matrix.platform }} artifacts
        if: always()
        run: |
          git config user.name "fleet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/${{ matrix.platform }}/ 2>/dev/null || true
          git add content/${{ matrix.platform }}/ 2>/dev/null || true
          git add site/shared/img/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "fleet[${{ matrix.platform }}]: $(date -u +%F_%H:%M) run [skip ci]" || true
          git pull --rebase=autostash origin ${GITHUB_REF_NAME} 2>/dev/null || true
          git push 2>/dev/null || echo "push deferred (another matrix job holds the lock; next run syncs)"

  dashboard:
    needs: platform
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Command Deck from live fleet state
        run: node scripts/dashboard.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Command Deck
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/dashboard --project-name=fleetdeck --commit-dirty=true

      - name: Fleet summary
        if: always()
        run: node scripts/monitor/status.mjs --summary
